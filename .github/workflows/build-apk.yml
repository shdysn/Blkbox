name: Build App Cloner APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle Wrapper Executable
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          fi

      - name: Run Unit Tests
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace
          else
            gradle :app:testDebugUnitTest --no-daemon --stacktrace
          fi

      - name: Assemble Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify Debug APK Output
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$DEBUG_APK" ] || [ ! -s "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not generated or has zero file size!"
            exit 1
          fi
          echo "Debug APK built successfully at: $DEBUG_APK"
          ls -lh "$DEBUG_APK"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-cloner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Assemble Release APK (Unsigned/Configured)
        continue-on-error: true
        run: |
          if [ -f gradlew ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace || echo "Release build requires keystore configuration"
          else
            gradle :app:assembleRelease --no-daemon --stacktrace || echo "Release build requires keystore configuration"
          fi

      - name: Upload Release APK Artifact (if available)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-cloner-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
