name: Build App Cloner APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JAVA_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"
      GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8 -Dorg.gradle.jvmargs=\"-Xmx4g -Djava.awt.headless=true -XX:MaxMetaspaceSize=1g\""

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore Debug Keystore
        run: |
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Restoring debug.keystore from debug.keystore.base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ -f debug.keystore ]; then
            echo "debug.keystore successfully verified:"
            ls -lh debug.keystore
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> $GITHUB_ENV
          if [ -d "$SDK_PATH/cmdline-tools/latest/bin" ]; then
            yes | "$SDK_PATH/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          fi

      - name: Ensure Gradle Wrapper is Executable
        run: |
          chmod +x gradlew

      - name: Assemble Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Verify Debug APK Output
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$DEBUG_APK" ] || [ ! -s "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not generated or has zero file size!"
            exit 1
          fi
          echo "Debug APK built successfully at: $DEBUG_APK"
          ls -lh "$DEBUG_APK"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-cloner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Assemble Release APK
        continue-on-error: true
        run: |
          ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace || echo "Release build requires keystore configuration"

      - name: Upload Release APK Artifact (if available)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-cloner-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Run Unit Tests
        continue-on-error: true
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon --no-configuration-cache --stacktrace
