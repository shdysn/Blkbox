name: Build App Cloner APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android APK (Python Self-Healing)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      JAVA_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"
      GRADLE_OPTS: "-Djava.awt.headless=true -Dfile.encoding=UTF-8"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Accept Licenses
        run: |
          SDK_PATH="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_PATH" >> $GITHUB_ENV
          
          SDKMANAGER="$SDK_PATH/cmdline-tools/latest/bin/sdkmanager"
          if [ -f "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses 2>/dev/null || true
            "$SDKMANAGER" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "platform-tools" 2>/dev/null || true
          fi

      - name: Ensure Gradle Wrapper & Scripts Executable
        run: |
          chmod +x gradlew
          chmod +x .github/scripts/self_repair.py

      - name: Assemble Debug APK (Python Intelligent Self-Repair)
        run: |
          python .github/scripts/self_repair.py :app:assembleDebug

      - name: Verify Debug APK Output
        run: |
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$DEBUG_APK" ] || [ ! -s "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not generated or has zero file size!"
            exit 1
          fi
          echo "Debug APK built successfully at: $DEBUG_APK"
          ls -lh "$DEBUG_APK"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-cloner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Assemble Release APK (Python Self-Repair)
        continue-on-error: true
        run: |
          python .github/scripts/self_repair.py :app:assembleRelease

      - name: Upload Release APK Artifact (if available)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-cloner-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Run Unit Tests (Python Self-Repair)
        continue-on-error: true
        run: |
          python .github/scripts/self_repair.py :app:testDebugUnitTest
